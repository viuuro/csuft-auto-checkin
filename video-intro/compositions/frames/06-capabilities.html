        font-family:"Inter",sans-serif;

      /* ---------- layout ---------- */

        display:flex;flex-direction:column;gap:.95cqw;
      }
      .f06-capabilities-card--tail .f06-capabilities-list{color:rgba(20,20,19,.64)}
      .f06-capabilities-item{display:list-item;position:relative;padding-left:1.9cqw;will-change:transform,opacity}
      .f06-capabilities-item::before{
        content:"";position:absolute;left:.1cqw;top:.62cqw;
        width:.5cqw;height:.5cqw;border-radius:9999px;
        background:rgba(250,249,245,.34);
      }
      .f06-capabilities-card--tail .f06-capabilities-item::before{background:rgba(250,249,245,.26)}
      .f06-capabilities-rulewrap{
        margin-top:1.5cqw;height:1px;width:100%;

      }

        display:block;height:1px;width:100%;background:rgba(20,20,19,.12);

    <!-- full-bleed ground on its own clip layer -->
    <div data-hf-id="hf-r4v2" class="clip f06-capabilities-ground" data-start="0" data-duration="15.5" data-track-index="0" id="f06-capabilities-el1"></div>

      <div data-hf-id="hf-u7em" class="f06-capabilities-two">
        <!-- ============ LEFT CARD · foreground subject ============ -->
        <section data-hf-id="hf-wn33" class="clip f06-capabilities-card" data-start="0" data-duration="15.5" data-track-index="2" id="f06-capabilities-el3">

    <script>
      (function () {
        var root = document.getElementById("root");
        if (!root || !window.gsap) return;
        var qa = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

        var ground = qa(".f06-capabilities-ground")[0];
        var kicker = qa(".f06-capabilities-kicker")[0];
        var cards = qa(".f06-capabilities-card");
        var left = cards[0];
        var right = cards[1];

        var tl = gsap.timeline({ paused: true });

        /* ---------- Scene 1 (0.0-1.8s) — split-screen prep:
           ground reads, kicker lands, both tile frames rise into place.
           Voice cue: "工具分两部分。" ---------- */
        tl.fromTo(ground, { opacity: 0.92 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 0);
        tl.fromTo(kicker, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "power2.out" }, 0.2);
        tl.fromTo(left, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power2.out" }, 0.55);
        tl.fromTo(right, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power2.out" }, 0.9);

        function fill(card, t0) {
          var label = card.querySelector(".f06-capabilities-label");
          var title = card.querySelector(".f06-capabilities-title");
          var items = Array.prototype.slice.call(card.querySelectorAll(".f06-capabilities-item"));
          var rule = card.querySelector(".f06-capabilities-rulewrap");

          tl.fromTo(label, { y: 12, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, t0);
          tl.fromTo(title, { y: 18, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, t0 + 0.75);
          /* three pops, one per spoken item */
          items.forEach(function (li, i) {
            tl.fromTo(li, { y: 12, scale: 0.94, opacity: 0 },
              { y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.7)" }, t0 + 2.05 + i * 1.1);
          });
          if (rule) {
            /* hairline draws on under the settled two — the admin card sign-off */
            tl.fromTo(rule, { scaleX: 0.06, opacity: 0 },
              { scaleX: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, t0 + 4.85);
          }
        }

        /* ---------- Scene 2 (1.8-8.0s) — LEFT card fills completely.
           Voice cue: "用户端提交申请、绑定学校账号、查看自己的签到日历。" ---------- */
        fill(left, 1.9);

        /* ---------- Scene 3 (8.0-13.0s) — RIGHT card fills ~1.2s later, lower contrast.
           Voice cue: "管理端由管理员亲自审批每一个申请——有且仅有管理员本人的账号能登录。" ---------- */
        fill(right, 8.35);

        /* ---------- Scene 4 (13.0-15.0s) — both cards hold still for the read.
           No exit: the root transition owns the cut. ---------- */

        window.__timelines = window.__timelines || {};
        window.__timelines["06-capabilities"] = tl;
      })();
    </script>

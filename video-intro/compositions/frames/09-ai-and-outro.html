  <script>
    (function () {
      var ID = "09-ai-and-outro";
      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0.0–2.2s) · kicker lands, bubble pops ---------- */
      tl.fromTo("#f09-kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.10);
      /* the focal surface is on screen before 0.5s — its commands arrive in Scene 3 */
      tl.fromTo("#f09-panel", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.15);
      tl.fromTo("#f09-bubble", { opacity: 0, y: 12, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "power3.out" }, 0.85);

      /* ---------- Scene 2 (2.2–4.6s) · the explanatory line, then a reading pause ---------- */
      tl.fromTo("#f09-note", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.35);

      /* ---------- Scene 3 (4.6–10.6s) · four commands typed one by one ----------
         Every character is a real span holding its space from t=0 (no reflow); the
         typing is a deterministic per-character opacity + 4px keystroke stagger. */
      var SEQ = [
        { id: "f09-l1", n: 26 },   /* python tools/verify_all.py          */
        { id: "f09-l2", n: 33 },   /* python tools/check_server_sync.py   */
        { id: "f09-l3", n: 29 },   /* python tools/audit_privacy.py       */
        { id: "f09-l4", n: 34 }    /* python tools/preflight.py --online  */
      ];
      var CHAR = 0.03;    /* s between keystrokes */
      var CDUR = 0.045;   /* per-character ink-in */
      var LEAD = 0.12;    /* prompt settles, then the command starts */
      var DWELL = 0.5;    /* reading pause once a command has landed */
      var t = 4.60;

      SEQ.forEach(function (step) {
        var line = document.getElementById(step.id);
        if (!line) { t += LEAD + step.n * CHAR + CDUR + DWELL; return; }
        var prompt = line.querySelector(".f09-pp");
        var chars = line.querySelectorAll(".f09-ch");
        if (prompt) {
          tl.fromTo(prompt, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, t);
        }
        var c0 = t + LEAD;
        tl.fromTo(chars, { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: CDUR, ease: "power1.out", stagger: CHAR }, c0);
        t = c0 + (step.n - 1) * CHAR + CDUR + DWELL;
      });

      /* ---------- Scene 4 (10.6–14.0s) · hairline draws, closing row, then still ---------- */
      tl.fromTo("#f09-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.42, ease: "power3.out", transformOrigin: "left center" }, 10.62);
      tl.fromTo("#f09-repo", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 11.15);
      tl.fromTo("#f09-warn", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 11.50);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
      tl.seek(0);
    })();
  </script>

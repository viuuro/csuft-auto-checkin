<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function () {
  var ID = "02-disclaimer-all";
  var DOM = "f" + ID + "-";           // -> "f02-disclaimer-all-"
  function el(suffix) { return document.getElementById(DOM + suffix); }

  var tl = gsap.timeline({ paused: true });

  /* ============================================================
     开场第一帧：**整页一次性落定**（不做逐条宣读）。
     七条条文与页脚在同一拍内全部出现 —— 条目之间只有 0.035s 的错位，
     整页在约 0.6s 内落完，做出"文件整页落下"的观感。
     之后进入长时间静置，供阅读；不加任何装饰性动效。
     ============================================================ */

  /* ---------- 整页落定（0.0–1.4s）---------- */
  tl.fromTo(el("kicker"),
      { autoAlpha: 0, y: -8 },
      { autoAlpha: 1, y: 0, duration: 0.40, ease: "power2.out" }, 0.0);

  tl.fromTo(el("title"),
      { autoAlpha: 0, y: 18 },
      { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.05);

  tl.fromTo(el("rule"),
      { scaleX: 0 },
      { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 0.12);

  /* 七条一起落：每条只错开 0.035s（最末条约 0.21s 起），
     整页在 1.0s 前全部到位。 */
  var stagger = 0.035;
  for (var i = 1; i <= 7; i++) {
    var t = 0.18 + (i - 1) * stagger;
    tl.fromTo(el("n" + i),
        { autoAlpha: 0, y: -8 },
        { autoAlpha: 1, y: 0, duration: 0.34, ease: "power2.out" }, t);

    tl.fromTo(el("h" + i),
        { autoAlpha: 0, y: 8 },
        { autoAlpha: 1, y: 0, duration: 0.36, ease: "power2.out" }, t + 0.03);

    tl.fromTo(el("b" + i),
        { autoAlpha: 0, y: 6 },
        { autoAlpha: 1, y: 0, duration: 0.38, ease: "power2.out" }, t + 0.06);
  }

  tl.fromTo(el("footer"),
      { autoAlpha: 0, y: 8 },
      { autoAlpha: 1, y: 0, duration: 0.42, ease: "power2.out" }, 0.42);

  /* ---------- 静置阅读（约 1.4s 起到帧末）----------
     全部内容已就位，此后不做任何位移或呼吸动效。 */

  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
